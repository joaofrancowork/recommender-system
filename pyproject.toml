[project]
name = "recommender-system"
version = "0.1.0"
description = "Movie recommendations on MovieLens: popularity, item-kNN, implicit ALS from scratch, content embeddings and a hybrid for cold start, with temporal evaluation and a FastAPI service."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Franco" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "scipy>=1.13",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]

[project.scripts]
recsys = "recsys.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "mypy>=1.11",
    "nbconvert>=7.16",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
ignore = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=recsys --cov-report=term-missing"

[tool.coverage.run]
omit = ["src/recsys/embeddings.py"]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
